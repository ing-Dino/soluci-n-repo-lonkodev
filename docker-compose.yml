name: ayudantiaS1
services:
  app:
    build: ./app
    ports:
      - "8080:3000"
    environment:
      DB_HOST: db
      DB_USER: app
      DB_PASSWORD: app123
      DB_NAME: ayudantiaS1
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL","wget -q --spider http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: ayudantiaS1
      MARIADB_USER: app
      MARIADB_PASSWORD: app123
    volumes:
      - datos-db:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
volumes:
  datos-db:
